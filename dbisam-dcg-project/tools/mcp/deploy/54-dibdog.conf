# Dibdog MCP — public route for the DBISAM SQL grammar checker.
#
# Install to /etc/lighttpd/conf-enabled/54-dibdog.conf on miami and
# enable mod_proxy (`sudo lighty-enable-mod proxy`), which supplies
# proxy.server and loads as 10-proxy.conf — alphabetically before this
# file, which is what the ordering requires.
#
# Unlike Apache's ProxyPass, lighttpd's mod_proxy does NOT strip the
# matched prefix: the backend receives the full "/dibdog/..." path. That
# is fine here because dibdog-mcp answers POST on any path, but it is the
# detail that bites when porting a config from rivsprod01.
#
# Authentication is the server's own bearer token, not mod_auth, so the
# Authorization header must reach the backend untouched.

$HTTP["url"] =~ "^/dibdog(/|$)" {
    proxy.server = ( "" =>
        ( ( "host" => "127.0.0.1", "port" => 8791 ) )
    )
}
